name: CI — Test, Lint & Build

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: Lint & Code Style
  # ============================================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (next lint)
        run: npm run lint

  # ============================================================
  # JOB 2: DB & API Integration Tests (Jest)
  # ============================================================
  test-api:
    name: API & DB Tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || vars.DATABASE_URL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD != '' && secrets.ADMIN_PASSWORD || vars.ADMIN_PASSWORD }}
      RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY != '' && secrets.RECAPTCHA_SECRET_KEY || vars.RECAPTCHA_SECRET_KEY }}
      TEST_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run DB tests (Jest)
        run: npm run test:db
        timeout-minutes: 5

      - name: Start dev server in background for API tests
        run: |
          npm run dev &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run API integration tests (Jest)
        run: npm run test:api
        timeout-minutes: 5

  # ============================================================
  # JOB 3: E2E Tests (Playwright)
  # ============================================================
  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || vars.DATABASE_URL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD != '' && secrets.ADMIN_PASSWORD || vars.ADMIN_PASSWORD }}
      TEST_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start dev server in background
        run: |
          npm run dev &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        run: npm run test:e2e
        timeout-minutes: 10

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ============================================================
  # JOB 4: Production Build Check
  # ============================================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test-api, test-e2e]

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || vars.DATABASE_URL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD != '' && secrets.ADMIN_PASSWORD || vars.ADMIN_PASSWORD }}
      NEXT_PUBLIC_BASE_URL: https://www.comeetindia.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run next build
        run: npm run build
        timeout-minutes: 10

      - name: Build success — ready for Vercel deployment
        run: echo "✅ Build passed. Vercel will auto-deploy from main branch."

  # ============================================================
  # JOB 5: Security Headers Check
  # ============================================================
  security-headers:
    name: Security Headers Check
    runs-on: ubuntu-latest
    needs: lint

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || vars.DATABASE_URL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD != '' && secrets.ADMIN_PASSWORD || vars.ADMIN_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start dev server
        run: |
          npm run dev &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Verify security headers
        run: |
          echo "Checking security headers on homepage..."
          HEADERS=$(curl -sI http://localhost:3000/)

          check_header() {
            if echo "$HEADERS" | grep -qi "$1"; then
              echo "✅ $1 header present"
            else
              echo "❌ MISSING: $1 header"
              exit 1
            fi
          }

          check_header "x-frame-options"
          check_header "x-content-type-options"
          check_header "referrer-policy"
          check_header "content-security-policy"
          check_header "permissions-policy"

          echo "✅ All security headers verified."
